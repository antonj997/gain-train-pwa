<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F1115" />
    <script>
      // Apply the saved or system theme, and the chosen language, before first paint.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("gain-train-theme");
          theme =
            saved === "light" || saved === "dark"
              ? saved
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
        } catch (e) {}
        document.documentElement.classList.add(theme);
        try {
          if (localStorage.getItem("gt-language") === "sv")
            document.documentElement.lang = "sv";
        } catch (e) {}
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta)
          meta.setAttribute("content", theme === "dark" ? "#0F1115" : "#F4F5F7");
      })();
    </script>
    <link rel="icon" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The page runs under the status bar; every screen pads by
         env(safe-area-inset-top) and a band keeps the white clock readable. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Gain Train" />
    <title>Gain Train — Workout Log</title>
    <meta
      name="description"
      content="Log your sets. See your progress. Works offline."
    />
    <meta name="author" content="Gain Train" />

    <meta property="og:title" content="Gain Train — Workout Log" />
    <meta
      property="og:description"
      content="Log your sets. See your progress. Works offline."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://antonj997.github.io/gain-train-pwa/icon-512.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
